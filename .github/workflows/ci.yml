# Continuous Integration — quality gate for every push and pull request.
#
# Unlike the deploy workflows (which run only on pushes to main that touch their package and
# require Cloudflare secrets), this workflow runs on EVERY push and PR to verify the whole
# repo stays healthy: lint, type-check, and tests for both the game and the backend Worker.
# It needs no secrets and never deploys, so it is safe to run on forks and PRs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game:
    name: Game (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Build with empty public config — proves the static game builds and runs fully
      # offline (local leaderboard, console telemetry) with no backend or Grafana wired.
      - run: npm run build

  backend:
    name: Backend Worker (lint · typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
