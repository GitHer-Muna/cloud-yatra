# Deploy the Cloud Yatra backend Worker (Cloudflare Worker + D1) to Cloudflare.
#
# This is SEPARATE from the Pages deploy (deploy-cloudflare.yml). It runs only when files
# under backend/** change. It type-checks, tests (in the real workerd runtime), applies any
# new D1 migrations to the remote database, and deploys the Worker.
#
# Prerequisites (one-time, by the repo owner):
#   1. Create the D1 database:  cd backend && npx wrangler d1 create cloud-yatra
#      → paste the returned database_id into backend/wrangler.toml.
#   2. Repository secrets (Settings → Secrets and variables → Actions):
#        CLOUDFLARE_API_TOKEN   — token with "Workers Scripts: Edit" + "D1: Edit"
#        CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
#   3. (Optional) Grafana push secrets set via `wrangler secret put ...` once locally:
#        GRAFANA_LOKI_URL/USER/TOKEN, GRAFANA_OTLP_URL/USER/TOKEN
name: Deploy backend Worker

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test
        run: |
          npm run typecheck
          npm test

      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Normally migrations must apply before deploy. But a D1 FREE-TIER daily row-read/
        # write limit (Cloudflare error 7500) is a transient quota condition that resets at
        # midnight UTC and is unrelated to the Worker code — it should NOT block deploying
        # an otherwise-healthy Worker. So: run migrations; if they fail ONLY because of the
        # rate limit, emit a warning and continue; any OTHER failure still fails the job.
        run: |
          set +e
          out="$(npx wrangler d1 migrations apply cloud-yatra --remote 2>&1)"
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            if echo "$out" | grep -qiE "7500|daily (row )?(read|write) limit|exceeded .* limit"; then
              echo "::warning::D1 free-tier daily limit hit (error 7500) — skipping migrations this run; they will apply on the next deploy after the quota resets at midnight UTC. Worker code will still deploy."
            else
              echo "::error::D1 migration failed for a non-quota reason."
              exit $code
            fi
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy

      # Optional Worker secrets. Each is pushed ONLY when the matching repository secret is
      # non-empty, so the deploy stays green whether or not you've set them, and an unset
      # value never wipes an existing Worker secret. To enable any of these, add the secret
      # under Settings → Secrets and variables → Actions, then re-run this workflow
      # (or push any change under backend/**).
      #   CHAOS_ADMIN_TOKEN                          — arms Chaos Mode (Shift+C in-game)
      #   GRAFANA_LOKI_URL / _USER / _TOKEN          — push backend logs to Grafana Loki
      #   GRAFANA_OTLP_URL / _USER / _TOKEN          — push traces to Grafana Tempo
      - name: Push optional Worker secrets (only those set)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHAOS_ADMIN_TOKEN: ${{ secrets.CHAOS_ADMIN_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GRAFANA_LOKI_URL: ${{ secrets.GRAFANA_LOKI_URL }}
          GRAFANA_LOKI_USER: ${{ secrets.GRAFANA_LOKI_USER }}
          GRAFANA_LOKI_TOKEN: ${{ secrets.GRAFANA_LOKI_TOKEN }}
          GRAFANA_OTLP_URL: ${{ secrets.GRAFANA_OTLP_URL }}
          GRAFANA_OTLP_USER: ${{ secrets.GRAFANA_OTLP_USER }}
          GRAFANA_OTLP_TOKEN: ${{ secrets.GRAFANA_OTLP_TOKEN }}
        run: |
          set -euo pipefail
          put_if_set() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then
              echo "Setting Worker secret: $name"
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "Skipping unset secret: $name"
            fi
          }
          for s in \
            CHAOS_ADMIN_TOKEN METRICS_TOKEN \
            GRAFANA_LOKI_URL GRAFANA_LOKI_USER GRAFANA_LOKI_TOKEN \
            GRAFANA_OTLP_URL GRAFANA_OTLP_USER GRAFANA_OTLP_TOKEN; do
            put_if_set "$s"
          done
