# One-off maintenance: reset the shared leaderboard (D1 `scores` table).
#
# Runs ONLY when you trigger it by hand (workflow_dispatch) and requires you to type the
# confirmation word, so it can never fire accidentally. It uses the SAME CLOUDFLARE_API_TOKEN
# repository secret that already deploys the Worker — so there's no local wrangler login and
# no token pasted anywhere. It clears ONLY the `scores` table (the leaderboard); events,
# sessions, and daily_rollup are untouched.
name: Reset leaderboard (D1 scores)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to confirm wiping the leaderboard (any casing)'
        required: true
        default: ''

jobs:
  reset:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Guard — require the confirmation word
        run: |
          # Accept the confirmation word in any casing, with surrounding whitespace
          # trimmed, so "RESET", "reset", or " Reset " all work. The manual trigger +
          # typing the word is already the deliberate "are you sure?" speed bump; we don't
          # also need an exact-case match (which previously aborted a genuine "reset").
          raw="${{ github.event.inputs.confirm }}"
          trimmed="$(echo "$raw" | xargs)"           # trim leading/trailing whitespace
          upper="$(echo "$trimmed" | tr '[:lower:]' '[:upper:]')"
          if [ "$upper" != "RESET" ]; then
            echo "::error::Confirmation word was '$raw'. Type RESET (any casing) to confirm wiping the leaderboard. Aborting — nothing was changed."
            exit 1
          fi
          echo "Confirmation accepted — proceeding to wipe the scores table."

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wipe the scores table (leaderboard only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute cloud-yatra --remote --command "DELETE FROM scores;"

      - name: Show the now-empty leaderboard
        run: curl -s https://cloud-yatra-api.im-shree03.workers.dev/leaderboard
