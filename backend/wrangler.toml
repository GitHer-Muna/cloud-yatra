#:schema node_modules/wrangler/config-schema.json
# Cloud Yatra backend Worker.
#
# This is a SEPARATE Cloudflare Worker from the static Pages site (cloud-yatra). The Pages
# project keeps serving the game unchanged; this Worker adds a small HTTP API backed by a
# free Cloudflare D1 (SQLite) database for shared telemetry + a cross-player leaderboard.
#
# Free-tier safe by design:
#   - Workers free plan: 100k requests/day.
#   - D1 free plan: 5 GB storage, 5M rows read/day, 100k rows written/day.
# The game batches telemetry and only writes bounded gameplay rows, so normal play stays
# comfortably inside the free tier.
name = "cloud-yatra-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Logs (free observability): structured console logs are retained and
# queryable in the dashboard, and can be pulled into Grafana Cloud.
[observability]
enabled = true

[observability.logs]
enabled = true

# D1 database binding. Create it once with `wrangler d1 create cloud-yatra`, then paste the
# returned database_id below (and into CI). Until then local dev uses a local SQLite file.
[[d1_databases]]
binding = "DB"
database_name = "cloud-yatra"
database_id = "edcc805e-f30c-4b2d-a409-1e4a6c31a9ae"
migrations_dir = "migrations"

# Public, non-secret runtime configuration. The browser's Pages origin is allowed by CORS.
# Override ALLOWED_ORIGINS for your real domains; "*" is fine while developing.
[vars]
ALLOWED_ORIGINS = "https://cloud-yatra.pages.dev,http://localhost:5173,https://curioushalibut2108.grafana.net"
ENVIRONMENT = "production"
SERVICE_NAME = "cloud-yatra-api"
# Grafana Cloud push endpoints are OPTIONAL. Leave empty to disable the push (the Worker
# still logs to Cloudflare Workers Logs and exposes /metrics for a pull scrape). Set these
# as Wrangler SECRETS, not here:  GRAFANA_LOKI_URL, GRAFANA_LOKI_USER, GRAFANA_LOKI_TOKEN,
#                                  GRAFANA_OTLP_URL,  GRAFANA_OTLP_TOKEN
# Chaos Mode admin gate (also a SECRET; unset = chaos control plane disabled):
#                                  CHAOS_ADMIN_TOKEN
